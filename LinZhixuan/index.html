<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林芷萱，生日快乐</title>
    <style>
        /* ============================================================
           底子：一页、居中、绿色系混合背景
           想自己设计的话，改下面 body 的 background 就能换背景，
           改 .happy / .name 就能换文字样式。就这两个地方。
           ============================================================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* 纯白背景 */
            background: #ffffff;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #222222;
        }

        /* Happy Birthday */
        .happy {
            font-size: clamp(26px, 6vw, 48px);
            font-weight: 600;
            letter-spacing: 4px;
        }

        /* 林芷萱 */
        .name {
            margin-top: 14px;
            font-size: clamp(44px, 11vw, 84px);
            font-weight: 900;
            letter-spacing: 8px;
        }
    </style>
</head>
<body>
    <main>
        <p class="happy">Happy Birthday</p>
        <h1 class="name">林芷萱</h1>
    </main>
</body>
</html>
