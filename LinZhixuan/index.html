<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林芷萱，生日快乐</title>
    <style>
        /* ============================================================
           底子：一页、居中、绿色系混合背景
           想自己设计的话，改下面 body 的 background 就能换背景，
           改 .happy / .name 就能换文字样式。就这两个地方。
           ============================================================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* 各种绿混在一起：深林绿打底 + 几团不同深浅的绿晕开 */
            background-color: #123b2d;
            background-image:
                radial-gradient(60% 50% at 18% 20%, rgba(58, 168, 138, 0.55) 0%, rgba(58, 168, 138, 0) 100%),
                radial-gradient(50% 45% at 82% 16%, rgba(126, 200, 156, 0.45) 0%, rgba(126, 200, 156, 0) 100%),
                radial-gradient(55% 55% at 78% 82%, rgba(30, 122, 90, 0.60) 0%, rgba(30, 122, 90, 0) 100%),
                radial-gradient(45% 40% at 22% 84%, rgba(160, 220, 180, 0.32) 0%, rgba(160, 220, 180, 0) 100%),
                radial-gradient(75% 65% at 50% 48%, rgba(22, 78, 56, 0.85) 0%, rgba(22, 78, 56, 0) 100%),
                linear-gradient(160deg, #1b5e43 0%, #0e3b2a 55%, #164a35 100%);

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #ffffff;
        }

        /* Happy Birthday */
        .happy {
            font-size: clamp(26px, 6vw, 48px);
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 2px 12px rgba(0, 40, 25, 0.35);
        }

        /* 林芷萱 */
        .name {
            margin-top: 14px;
            font-size: clamp(44px, 11vw, 84px);
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 0 4px 20px rgba(0, 40, 25, 0.4);
        }
    </style>
</head>
<body>
    <main>
        <p class="happy">Happy Birthday</p>
        <h1 class="name">林芷萱</h1>
    </main>
</body>
</html>
