<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋果的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
        }
        body {
            min-height: 100vh;
            background-color: #66CCFF;
            color: #0d3f66;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px 50px;
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
        }
        /* 页面上飘着的小装饰 */
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            pointer-events: none;
            z-index: 0;
            animation: floaty 7s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-16px) rotate(8deg); }
        }
        .content {
            position: relative;
            z-index: 1;
        }
        .welcome-top-area {
            text-align: center;
            margin-bottom: 48px;
        }
        .ciallo-text {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
            letter-spacing: 1px;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.25);
            animation: wobble 3s ease-in-out infinite;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(-1.5deg); }
            50%      { transform: rotate(1.5deg); }
        }
        .title-text {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 26px;
            padding: 30px 32px;
            margin-bottom: 26px;
            box-shadow: 0 10px 30px rgba(0, 140, 214, 0.22);
            border: 2px solid #ffffff;
            position: relative;
            transition: transform 0.25s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .section-title {
            font-size: 15px;
            color: #0072c6;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .item-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .item-tag {
            padding: 9px 18px;
            background: linear-gradient(135deg, #ffffff 0%, #dff3ff 100%);
            border: 1.5px solid #b6e2ff;
            border-radius: 9999px;
            font-size: 13px;
            color: #16467a;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .item-tag:hover {
            background: linear-gradient(135deg, #7fd4ff 0%, #2e9fe6 100%);
            color: #ffffff;
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 16px rgba(46, 159, 230, 0.5);
        }
        .contact-wrap {
            text-align: center;
            margin: 16px 0 34px;
        }
        .contact-btn {
            background: linear-gradient(135deg, #59bfff 0%, #1f8ad6 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            padding: 14px 44px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(31, 138, 214, 0.45);
            transition: all 0.25s ease;
        }
        .contact-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 26px rgba(31, 138, 214, 0.55);
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 90, 150, 0.35);
            margin-top: 44px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
